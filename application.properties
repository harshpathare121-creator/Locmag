spring.application.name=CampusLock
server.port=${PORT:8080}
server.servlet.session.timeout=12h
spring.datasource.url=jdbc:sqlite:${CAMPUSLOCK_DB_PATH:./campuslock.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

spring.web.resources.static-locations=classpath:/
