<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusLock | College Locker Management</title>
<style>
:root{--primary:#4f46e5;--primary-dark:#3730a3;--light:#eef2ff;--bg:#f4f6fb;--text:#172033;--muted:#667085;--danger:#dc2626;--success:#166534;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:600;transition:.15s}button:hover{filter:brightness(.97);transform:translateY(-1px)}.primary{background:var(--primary);color:white}.secondary{background:var(--light);color:var(--primary)}.danger{background:#fee2e2;color:var(--danger)}.nav{background:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px max(4vw,20px);box-shadow:0 2px 12px #1720330a;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:var(--primary);white-space:nowrap}.nav-links{display:flex;gap:8px;flex-wrap:wrap}.nav-links button{background:white;color:#374151}.nav-links button:hover{background:var(--light);color:var(--primary)}main{max-width:1180px;margin:0 auto;padding:28px 20px 40px}.hero{background:linear-gradient(135deg,#fff 0%,#eef2ff 100%);border:1px solid #e0e7ff;border-radius:24px;padding:clamp(35px,7vw,80px) 25px;text-align:center}.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--primary);font-weight:800}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.08;margin:18px 0}.hero h1 span{color:var(--primary)}.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px;margin:0 auto 28px}.hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.section-title{font-size:26px;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.card,.form-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 18px #17203308}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin-top:8px;overflow-wrap:anywhere}.stack{display:flex;flex-direction:column;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.form-wrap{max-width:540px;margin:10px auto}.form-card h2{margin:0 0 6px}.form-card .intro{margin:0 0 20px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;background:white;outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51c}.full{width:100%}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:var(--light);color:var(--primary)}.pill.booked{background:#fee2e2;color:#991b1b}.pill.available{background:#dcfce7;color:#166534}.locker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.locker-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:10px}.locker-card h3{margin:0;font-size:19px}.locker-card p{margin:0;color:var(--muted);font-size:14px}.locker-card button{margin-top:4px}.table-wrap{overflow:auto;background:white;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px}th{background:#f8fafc;color:#475467;white-space:nowrap}tr:last-child td{border-bottom:0}.table-actions{display:flex;gap:6px}.table-actions button{padding:7px 10px;font-size:12px}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.5}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:20;max-width:calc(100vw - 36px)}.danger-text{color:var(--danger)}.notification{border-left:4px solid var(--primary);background:#eef2ff;padding:12px 14px;border-radius:8px;margin:8px 0;font-size:14px;line-height:1.5}.notification.unread{border-left-color:#d97706;background:#fffbeb}.notification.success{border-left-color:#16a34a;background:#f0fdf4}.notification.rejected{border-left-color:#dc2626;background:#fef2f2}.request-actions{display:flex;gap:8px;flex-wrap:wrap}.request-actions button{padding:8px 10px;font-size:12px}@media(max-width:800px){.nav{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.locker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:18px 12px 30px}.grid,.grid.two,.locker-grid{grid-template-columns:1fr}.nav-links{width:100%}.nav-links button{padding:8px 10px;font-size:13px}.hero{border-radius:16px}.stat,.card,.form-card{padding:16px}}
</style>
</head>
<body>
<header class="nav">
  <div class="logo">CampusLock</div>
  <nav class="nav-links" aria-label="Main navigation">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('login')">Student Login</button>
    <button onclick="showPage('register')">Register</button>
    <button onclick="showPage('adminLogin')">Admin</button>
  </nav>
</header>
<main id="app"></main>
<footer class="footer">CampusLock · Java Spring Boot · SQLite</footer>
<div id="toast" class="toast hidden" role="status"></div>
<script>
let currentRole='GUEST', currentStudent=null, toastTimer;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3200)}
async function api(path, options={}){
  const opts={credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}};
  const response=await fetch(path,opts);let data={};try{data=await response.json()}catch(e){}
  if(!response.ok)throw new Error(data.error||data.message||`Request failed (${response.status})`);
  return data;
}
function priority(distance){return distance>=30?'VERY HIGH':distance>=15?'HIGH':distance>=5?'MEDIUM':'LOW'}
function notificationHTML(n){return `<div class="notification ${esc(n.type||'')} ${n.read?'':'unread'}"><div class="row"><strong>${esc(n.title)}</strong><small class="muted">${esc(n.date||'')}</small></div><div>${esc(n.message)}</div></div>`}
function homePage(){return `<section class="hero"><div class="eyebrow">COLLEGE LOCKER MANAGEMENT SYSTEM</div><h1>Smart Locker<br><span>Allocation</span></h1><p>A simple and fair college locker system. Students living farther from college receive higher allocation priority.</p><div class="hero-actions"><button class="primary" onclick="showPage('register')">Get a Locker</button><button class="secondary" onclick="showPage('login')">Student Login</button></div></section><section class="stack" style="margin-top:28px"><h2 class="section-title">How CampusLock works</h2><div class="grid"><article class="card"><div class="pill">01 · Register</div><h3>Create your account</h3><p class="muted">Enter your student details, home address and distance from college.</p></article><article class="card"><div class="pill">02 · Priority</div><h3>Know your priority</h3><p class="muted">Your distance determines your priority category automatically.</p></article><article class="card"><div class="pill">03 · Request</div><h3>Request a locker</h3><p class="muted">Choose an available locker, select a duration and wait for admin approval.</p></article></div><div class="notice">Your data is stored in the shared SQLite database through the Java backend. For deployment, configure a persistent disk and change the default admin credentials.</div></section>`}
function registerPage(){return `<div class="form-wrap"><form class="form-card" onsubmit="registerStudent(event)"><h2>Student Registration</h2><p class="intro">Create your CampusLock account.</p><div class="field"><label>Full Name</label><input name="name" required maxlength="80" autocomplete="name"></div><div class="field"><label>Student ID</label><input name="studentId" required maxlength="40"></div><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (minimum 8 characters)</label><input name="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>Home Address</label><input name="address" required maxlength="160" autocomplete="street-address"></div><div class="field"><label>Home-to-College Distance (km)</label><input name="distance" type="number" min="0" max="10000" step="0.1" required></div><button class="primary full" type="submit">Create Account</button><p class="muted">Already registered? <a href="#" onclick="showPage('login');return false">Student login</a></p></form></div>`}
function loginPage(){return `<div class="form-wrap"><form class="form-card" onsubmit="studentLogin(event)"><h2>Student Login</h2><p class="intro">Login to manage your locker.</p><div class="field"><label>Student ID</label><input name="studentId" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary full" type="submit">Login</button><p class="muted">New to CampusLock? <a href="#" onclick="showPage('register');return false">Create an account</a></p></form></div>`}
function adminLoginPage(){return `<div class="form-wrap"><form class="form-card" onsubmit="adminLogin(event)"><h2>Admin Login</h2><p class="intro">College locker administration.</p><div class="field"><label>Username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary full" type="submit">Login as Admin</button><p class="muted">For a local first run, default credentials are admin / admin123. Set ADMIN_USERNAME and ADMIN_PASSWORD before deploying.</p></form></div>`}
function stat(label,value){return `<div class="stat"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
function studentPage(d){const s=d.student||{};const pending=(d.requests||[]).find(r=>r.status==='PENDING');const active=(d.requests||[]).filter(r=>r.status!=='PENDING');const notes=d.notifications||[];const available=(d.lockers||[]).filter(l=>l.available&&!l.pending);
 const booking=s.booking?`<section class="card stack"><div class="row"><div><h2 class="section-title">Your Locker</h2><p class="muted">Your locker is currently allocated.</p></div><span class="pill available">BOOKED</span></div><div class="grid two">${stat('Locker',s.booking)}${stat('Duration',`${s.bookingDays} day(s)`)}${stat('Start date',s.bookingStart||'—')}${stat('Expiry date',s.bookingExpiry||'—')}</div><p class="muted">Days remaining: ${Math.max(0,Math.ceil((new Date((s.bookingExpiry||'2000-01-01')+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000))}</p><button class="danger" onclick="cancelBooking()">Cancel Booking</button></section>`:`<section class="card stack"><div class="row"><div><h2 class="section-title">Request a Locker</h2><p class="muted">Choose a locker and the number of days. The booking becomes active only after admin approval.</p></div><span class="pill">${esc(s.priority)} PRIORITY</span></div>${pending?`<div class="notice">You have a pending request for ${esc(pending.lockerId)} (${pending.days} day(s)). Wait for the admin decision.</div><button class="danger" onclick="cancelRequest(${Number(pending.id)})">Withdraw Pending Request</button>`:`<div class="locker-grid">${available.map(l=>`<article class="locker-card"><h3>${esc(l.id)}</h3><p>${esc(l.block)} · ${esc(l.size)}</p><span class="pill available">AVAILABLE</span><button class="primary" onclick="bookLocker('${esc(l.id)}')">Request Locker</button></article>`).join('')||'<div class="empty">No lockers are currently available to request.</div>'}</div>`}</section>`;
 const noteSection=`<section class="card stack"><div class="row"><h2 class="section-title">Notifications</h2><button class="secondary" onclick="markNotificationsRead()">Mark all read</button></div>${notes.length?notes.map(notificationHTML).join(''):'<div class="empty">No notifications yet.</div>'}</section>`;
 const historyRows=active.map(r=>`<tr><td>${esc(r.lockerId)}</td><td>${r.days} day(s)</td><td><span class="pill ${r.status==='APPROVED'?'available':r.status==='REJECTED'?'booked':''}">${esc(r.status)}</span></td><td>${esc(r.createdAt||'—')}</td><td>${esc(r.decisionMessage||'—')}</td></tr>`).join('');
 return `<div class="stack"><section class="row"><div><h1 style="margin:0 0 7px">Student Dashboard</h1><div class="muted">Welcome, ${esc(s.name)}.</div></div><button class="danger" onclick="logout()">Logout</button></section><section class="grid">${stat('Student ID',s.id)}${stat('Distance',`${s.distance} km`)}${stat('Priority',s.priority)}</section>${booking}${noteSection}<section class="stack"><h2 class="section-title">Request History</h2><div class="table-wrap"><table><thead><tr><th>Locker</th><th>Duration</th><th>Status</th><th>Requested</th><th>Decision message</th></tr></thead><tbody>${historyRows||'<tr><td colspan="5">No completed requests yet.</td></tr>'}</tbody></table></div></section></div>`}
function adminPage(d){const stats=d.stats||{};const notes=d.notifications||[];const pending=d.requests||[];const requestsRows=pending.map(r=>`<tr><td>${esc(r.studentName)}</td><td>${esc(r.studentId)}</td><td>${esc(r.lockerId)}</td><td>${esc(r.block)} · ${esc(r.size)}</td><td>${r.days} day(s)</td><td>${esc(r.createdAt)}</td><td><div class="request-actions"><button class="primary" onclick="approveRequest(${Number(r.id)})">Approve</button><button class="danger" onclick="rejectRequest(${Number(r.id)})">Reject</button></div></td></tr>`).join('');
 const lockerRows=(d.lockers||[]).map(l=>{const s=(d.students||[]).find(x=>x.id===l.bookedBy);const waiting=pending.some(r=>r.lockerId===l.id);return `<tr><td>${esc(l.id)}</td><td>${esc(l.block)}</td><td>${esc(l.size)}</td><td><span class="pill ${l.available?'available':'booked'}">${l.available?'AVAILABLE':'BOOKED'}</span>${waiting?' <span class="pill">REQUEST PENDING</span>':''}</td><td>${esc(s?s.name:'—')}</td><td>${s?s.bookingDays:'—'}</td><td>${esc(s&&s.bookingExpiry?s.bookingExpiry:'—')}</td><td>${l.available?`<button class="danger" onclick="deleteLocker('${esc(l.id)}')">Delete</button>`:'—'}</td></tr>`}).join('');
 const ranked=(d.students||[]).map((s,i)=>`<tr><td>#${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.id)}</td><td>${s.distance} km</td><td><span class="pill">${esc(s.priority)}</span></td><td>${esc(s.booking||'Not Allocated')}</td><td>${s.bookingDays||'—'}</td><td>${esc(s.bookingExpiry||'—')}</td></tr>`).join('');
 const history=(d.history||[]).map(r=>`<tr><td>${esc(r.studentName)}</td><td>${esc(r.studentId)}</td><td>${esc(r.lockerId)}</td><td>${r.days} day(s)</td><td>${esc(r.status)}</td><td>${esc(r.decidedAt||'—')}</td><td>${esc(r.decisionMessage||'—')}</td></tr>`).join('');
 return `<div class="stack"><section class="row"><div><h1 style="margin:0 0 7px">Admin Dashboard</h1><div class="muted">Manage requests, lockers and student priority.</div></div><button class="danger" onclick="logout()">Logout</button></section><section class="grid">${stat('Pending Requests',stats.pending||0)}${stat('Total Lockers',stats.total||0)}${stat('Available',stats.available||0)}${stat('Booked',stats.booked||0)}${stat('Students',stats.students||0)}</section><section class="card stack"><div class="row"><h2 class="section-title">Admin Notifications</h2><button class="secondary" onclick="markNotificationsRead()">Mark all read</button></div>${notes.length?notes.map(notificationHTML).join(''):'<div class="empty">No notifications yet.</div>'}</section><section class="stack"><div class="row"><h2 class="section-title">Locker Booking Requests</h2><span class="pill">${pending.length} pending</span></div><p class="muted">Approve to allocate the locker, or reject to notify the student.</p><div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Locker</th><th>Locker details</th><th>Duration</th><th>Requested</th><th>Decision</th></tr></thead><tbody>${requestsRows||'<tr><td colspan="7">No pending locker requests.</td></tr>'}</tbody></table></div></section><section class="card"><h2 class="section-title">Add Locker</h2><form onsubmit="addLocker(event)" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end"><div class="field"><label>Locker number</label><input name="id" required placeholder="e.g. L-501" maxlength="40"></div><div class="field"><label>Block</label><select name="block"><option>Block A</option><option>Block B</option><option>Block C</option><option>Block D</option></select></div><div class="field"><label>Size</label><select name="size"><option>Small</option><option>Medium</option><option>Large</option></select></div><button class="primary" type="submit">Add Locker</button></form></section><section class="stack"><h2 class="section-title">Locker Management</h2><div class="table-wrap"><table><thead><tr><th>Locker</th><th>Block</th><th>Size</th><th>Status</th><th>Student</th><th>Days</th><th>Expiry</th><th>Action</th></tr></thead><tbody>${lockerRows||'<tr><td colspan="8">No lockers yet.</td></tr>'}</tbody></table></div></section><section class="stack"><h2 class="section-title">Student Priority Ranking</h2><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>ID</th><th>Distance</th><th>Priority</th><th>Locker</th><th>Days</th><th>Expiry</th></tr></thead><tbody>${ranked||'<tr><td colspan="8">No students registered yet.</td></tr>'}</tbody></table></div></section><section class="stack"><h2 class="section-title">Request History</h2><div class="table-wrap"><table><thead><tr><th>Student</th><th>ID</th><th>Locker</th><th>Duration</th><th>Status</th><th>Decision date</th><th>Message</th></tr></thead><tbody>${history||'<tr><td colspan="7">No decided requests yet.</td></tr>'}</tbody></table></div></section></div>`}
async function showPage(page){try{if(page==='student'){const d=await api('/api/student/dashboard');currentRole='STUDENT';currentStudent=d.student;app.innerHTML=studentPage(d)}else if(page==='admin'){const d=await api('/api/admin/dashboard');currentRole='ADMIN';currentStudent=null;app.innerHTML=adminPage(d)}else{app.innerHTML=page==='register'?registerPage():page==='login'?loginPage():page==='adminLogin'?adminLoginPage():homePage()}window.scrollTo({top:0,behavior:'smooth'})}catch(e){if(page==='student'||page==='admin'){currentRole='GUEST';currentStudent=null;app.innerHTML=page==='student'?loginPage():adminLoginPage();notify('Your session may have expired. Please log in again.')}else notify(e.message)}}
async function registerStudent(e){e.preventDefault();const f=new FormData(e.target);try{const data=Object.fromEntries(f.entries());data.distance=Number(data.distance);await api('/api/auth/register',{method:'POST',body:JSON.stringify(data)});notify('Account created. Please log in.');showPage('login')}catch(err){notify(err.message)}}
async function studentLogin(e){e.preventDefault();const f=new FormData(e.target);try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f.entries()))});currentRole='STUDENT';await showPage('student')}catch(err){notify(err.message)}}
async function adminLogin(e){e.preventDefault();const f=new FormData(e.target);try{await api('/api/auth/admin-login',{method:'POST',body:JSON.stringify(Object.fromEntries(f.entries()))});currentRole='ADMIN';await showPage('admin')}catch(err){notify(err.message)}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}currentRole='GUEST';currentStudent=null;showPage('home');notify('Logged out.')}
async function bookLocker(id){const raw=prompt('For how many days do you need this locker? Enter a whole number between 1 and 365.','7');if(raw===null)return;const days=Number(raw);if(!Number.isInteger(days)||days<1||days>365)return notify('Duration must be a whole number between 1 and 365.');try{const d=await api('/api/requests',{method:'POST',body:JSON.stringify({lockerId:id,days})});notify(d.message);await showPage('student')}catch(e){notify(e.message)}}
async function cancelRequest(id){if(!confirm('Withdraw this locker request?'))return;try{const d=await api(`/api/requests/${id}/withdraw`,{method:'POST'});notify(d.message);await showPage('student')}catch(e){notify(e.message)}}
async function cancelBooking(){if(!confirm('Cancel your active locker booking?'))return;try{const d=await api('/api/bookings/cancel',{method:'POST'});notify(d.message);await showPage('student')}catch(e){notify(e.message)}}
async function approveRequest(id){if(!confirm('Approve this request and allocate the locker?'))return;try{const d=await api(`/api/admin/requests/${id}/approve`,{method:'POST'});notify(d.message);await showPage('admin')}catch(e){notify(e.message);await showPage('admin')}}
async function rejectRequest(id){const reason=prompt('Optional reason for rejecting this request:','');if(reason===null)return;try{const d=await api(`/api/admin/requests/${id}/reject`,{method:'POST',body:JSON.stringify({reason:reason.trim()})});notify(d.message);await showPage('admin')}catch(e){notify(e.message)}}
async function addLocker(e){e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/admin/lockers',{method:'POST',body:JSON.stringify(Object.fromEntries(f.entries()))});notify(d.message);await showPage('admin')}catch(err){notify(err.message)}}
async function deleteLocker(id){if(!confirm(`Delete locker ${id}?`))return;try{const d=await api(`/api/admin/lockers/${encodeURIComponent(id)}`,{method:'DELETE'});notify(d.message);await showPage('admin')}catch(e){notify(e.message)}}
async function markNotificationsRead(){try{await api('/api/notifications/read',{method:'POST'});if(currentRole==='ADMIN')await showPage('admin');else if(currentRole==='STUDENT')await showPage('student')}catch(e){notify(e.message)}}
async function init(){try{const me=await api('/api/auth/me');if(me.role==='ADMIN'){currentRole='ADMIN';await showPage('admin');return}if(me.role==='STUDENT'){currentRole='STUDENT';currentStudent=me.student;await showPage('student');return}}catch(e){}showPage('home')}
init();
</script>
</body>
</html>
